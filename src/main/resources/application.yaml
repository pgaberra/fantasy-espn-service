spring:
  application:
    name: fantasy-espn-service
  threads:
    virtual:
      enabled: true
  datasource:
    # DB_OPTIONS is empty locally and on the deployed Coolify Postgres (same Docker
    # network, no TLS); set it to "?sslmode=require" when connecting to a managed
    # Postgres over a public/TLS link.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fantasy_espn}${DB_OPTIONS:}
    username: ${DB_USER:fantasy}
    # No default — the password is always supplied via the DB_PASSWORD env var
    # (Coolify in the deployed envs; your shell locally). Never commit a password here.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entity mapping.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8090}

# Pre-shared secret the BFF sends as X-Internal-Api-Key. Required in every environment: the
# app refuses to start if this is blank, so it never serves an unauthenticated internal API
# (this service stores per-user ESPN session cookies for private leagues). Set INTERNAL_API_KEY
# when running locally too; tests supply their own key.
internal:
  api-key: ${INTERNAL_API_KEY:}

# ESPN Fantasy v3 API. ESPN has no public OAuth for fantasy: public leagues need only a
# league id, private leagues need the user's espn_s2 + SWID cookies (stored encrypted, see
# TOKEN_ENCRYPTION_KEY). The encryption key defaults to empty so the app still boots for
# tests/CI — credential endpoints just fail at call time when it is unset.
espn:
  # Read host ESPN moved its fantasy reads to (April 2024): lm-api-reads.fantasy.espn.com.
  api-base-url: ${ESPN_API_BASE_URL:https://lm-api-reads.fantasy.espn.com}
  # Fantasy game code for NHL hockey.
  game-key: ${ESPN_GAME_KEY:fhl}
  # Season leagues are read for, as ESPN's season id. ESPN keys a season by the year it ends
  # in: 2026 is the 2025-26 season. Bump this once ESPN opens the next league year. A league
  # missing for this season falls back to the one before it.
  season: ${ESPN_SEASON:2026}
  # Season the cached player stat lines are read for. Defaults to the league season because
  # they are normally the same — the last completed season is both what leagues are still on
  # and what projections are seeded from. Set it explicitly once the league season moves on to
  # a year that has not been played yet.
  player-stats-season: ${ESPN_PLAYER_STATS_SEASON:${ESPN_SEASON:2026}}
  # When the cached stat lines are refreshed (UTC). ESPN's season totals change at most once a
  # day out of season, so a single nightly run is plenty.
  player-sync-cron: ${ESPN_PLAYER_SYNC_CRON:0 45 7 * * *}
  # Fill an empty cache once at startup so a fresh deployment serves the stats immediately
  # instead of waiting for the first nightly run.
  player-sync-on-startup: ${ESPN_PLAYER_SYNC_ON_STARTUP:true}
  # Base64 256-bit AES key for encrypting stored cookies (openssl rand -base64 32).
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: fantasy-espn-service
    version: ${APP_VERSION:dev}
