spring:
  application:
    name: fantasy-espn-service
  threads:
    virtual:
      enabled: true
  datasource:
    # DB_OPTIONS is empty locally and on the deployed Coolify Postgres (same Docker
    # network, no TLS); set it to "?sslmode=require" when connecting to a managed
    # Postgres over a public/TLS link.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fantasy_espn}${DB_OPTIONS:}
    username: ${DB_USER:fantasy}
    # No default — the password is always supplied via the DB_PASSWORD env var
    # (Coolify in the deployed envs; your shell locally). Never commit a password here.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entity mapping.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8090}

# Pre-shared secret the BFF sends as X-Internal-Api-Key. Required in every environment: the
# app refuses to start if this is blank, so it never serves an unauthenticated internal API
# (this service stores per-user ESPN session cookies for private leagues). Set INTERNAL_API_KEY
# when running locally too; tests supply their own key.
internal:
  api-key: ${INTERNAL_API_KEY:}

# ESPN Fantasy v3 API. ESPN has no public OAuth for fantasy: public leagues need only a
# league id, private leagues need the user's espn_s2 + SWID cookies (stored encrypted, see
# TOKEN_ENCRYPTION_KEY). The encryption key has no default: the app refuses to start when it
# is missing or doesn't decode to 32 bytes, so set it locally too; tests supply their own.
espn:
  # Read host ESPN moved its fantasy reads to (April 2024): lm-api-reads.fantasy.espn.com.
  api-base-url: ${ESPN_API_BASE_URL:https://lm-api-reads.fantasy.espn.com}
  # Fantasy game code for NHL hockey.
  game-key: ${ESPN_GAME_KEY:fhl}
  # Season leagues are read for, as ESPN's season id. ESPN keys a season by the year it ends
  # in: 2027 is the 2026-27 season, which ESPN opened for league setup in the summer of 2026.
  # A league missing for this season falls back to the one before it, so a manager who hasn't
  # renewed yet still syncs.
  season: ${ESPN_SEASON:2027}
  # The player pool to cache, as a *start* year: 2026 is the 2026-27 season. Unlike the two
  # settings around it this is not ESPN's end-year id — the player client converts, so the pool
  # season, the reference season and the rest of the app all say a season the same way.
  player-pool-season: ${ESPN_PLAYER_POOL_SEASON:2026}
  # The season a cached stat line is a reference for (start year): the last season actually
  # played, which is what projections are seeded from. It trails the pool season for most of
  # the year, because ESPN opens a season months before it is played and publishes all-zero
  # totals for it in the meantime. A sync refuses to replace anything unless it finds real
  # games played for this season, so an off-by-one can't quietly zero the cache. Bump it once
  # the pool season has been played.
  player-reference-season: ${ESPN_PLAYER_REFERENCE_SEASON:2025}
  # When the cached stat lines are refreshed (UTC). ESPN's season totals change at most once a
  # day out of season, so a single nightly run is plenty.
  player-sync-cron: ${ESPN_PLAYER_SYNC_CRON:0 45 7 * * *}
  # Refresh the cache once at startup when it is missing or older than player-stats-max-age,
  # so a fresh deployment serves the stats immediately instead of waiting for the first nightly
  # run — and so a deployment that changes what the sync stores doesn't sit on data written by
  # the previous version.
  player-sync-on-startup: ${ESPN_PLAYER_SYNC_ON_STARTUP:true}
  # How old the cache may be before a startup counts it as stale. Comfortably longer than the
  # nightly interval, so an ordinary restart doesn't re-fetch 33 MB for no reason.
  player-stats-max-age: ${ESPN_PLAYER_STATS_MAX_AGE:36h}
  # Base64 256-bit AES key for encrypting stored cookies (openssl rand -base64 32).
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY}

# Whether the app shows players' pictures: the same PLAYER_AVATARS_ENABLED the BFF reads, and off
# by default for the same reason — they are ESPN's photographs and we hold no licence to show them.
# On, each sync asks ESPN's image CDN which players it actually has a portrait for (one HEAD per
# player, eight at a time) and drops the headshot URL for the rest, roughly one in seven. Off, the
# CDN is not touched at all. Set it in both services or neither.
players:
  avatars:
    enabled: ${PLAYER_AVATARS_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: fantasy-espn-service
    version: ${APP_VERSION:dev}
