services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fantasy_espn
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
    ports:
      # Host port 5435 to avoid clashing with fantasy-db-service (5432) and
      # fantasy-yahoo-service (5434).
      - "5435:5432"
    volumes:
      - postgres_espn_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_espn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_espn_data:
